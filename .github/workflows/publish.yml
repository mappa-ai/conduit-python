name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Validate tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c 'from pathlib import Path; import re, sys; content = Path("pyproject.toml").read_text(encoding="utf-8"); match = re.search(r"^version = \"([^\"]+)\"$", content, re.MULTILINE); print(match.group(1)) if match else sys.exit("Could not parse version from pyproject.toml")')
          EXPECTED_TAG="v$VERSION"

          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag/package version mismatch: got $TAG_NAME, expected $EXPECTED_TAG"
            exit 1
          fi

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1
